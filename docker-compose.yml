services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthome-controller
    environment:
      - CONTROLLER_PORT=${CONTROLLER_PORT:-5000}
    ports:
      - "${CONTROLLER_PORT:-5000}:5000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 4s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    networks:
      - smarthome-net

  devices:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthome-devices
    environment:
      - CONTROLLER_HOST=controller
      - CONTROLLER_PORT=5000
    entrypoint: ["java", "-cp", "bin", "smarthome.launcher.DeviceLauncher", "controller", "5000"]
    depends_on:
      controller:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - smarthome-net

networks:
  smarthome-net:
    driver: bridge
